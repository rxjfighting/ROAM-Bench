name: CPU checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './code[geometry,test]'
      - run: python code/scripts/evaluate.py --dataset dataset --dry-run
      - run: python -m pytest -q code/tests
